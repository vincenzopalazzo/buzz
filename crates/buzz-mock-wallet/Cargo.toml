[package]
name = "buzz-mock-wallet"
description = "Dev-only local NWC mock wallet for end-to-end testing. Moves no real money."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "buzz_mock_wallet"
path = "src/lib.rs"

[[bin]]
name = "buzz-mock-wallet"
path = "src/main.rs"

[dependencies]
nostr = { workspace = true, features = ["nip04", "nip47"] }
tokio = { workspace = true }
tokio-util = { workspace = true }
tokio-tungstenite = { workspace = true }
futures-util = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
thiserror = { workspace = true }
hex = { workspace = true }
bitcoin = { version = "0.32", default-features = false, features = ["std", "secp-recovery"] }
lightning-invoice = { version = "0.34", features = ["std"] }
parking_lot = "0.12"
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
sha2 = { workspace = true }
tokio = { workspace = true, features = ["test-util", "rt-multi-thread", "macros", "time", "sync"] }
tracing-subscriber = { workspace = true }
